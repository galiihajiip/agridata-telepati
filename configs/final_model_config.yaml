# KONFIGURASI MODEL FINAL, dibekukan dan dipakai menghasilkan bobot yang disubmit.
#
# Isinya identik dengan kandidat B, configs/kaggle/yolov8s_p2_640_250ep.yaml,
# ditambah empat kunci (data_yaml, fraction, device, scheduler) yang dibutuhkan
# scripts/run_final_training.py dan notebook untuk pelatihan ulang lokal.
#
# Bobot final dilatih di Kaggle Notebooks (2x NVIDIA Tesla T4, DDP) dengan:
#
#     python scripts/kaggle_train.py --config configs/kaggle/yolov8s_p2_640_250ep.yaml \
#         --data-root <folder hasil scripts/export_kaggle_dataset.py>
#
# Pelatihan ulang lokal tetap dapat dijalankan dengan:
#
#     python scripts/run_final_training.py --config configs/final_model_config.yaml
#
# RIWAYAT MODEL FINAL, dicatat terbuka:
#
#   1. YOLOv8n 640, AdamW, 20 lalu 50 lalu 100 epoch di Apple Silicon MPS.
#      Model 100 epoch mencapai mAP@0.5 0,6678 pada split valid. Konfigurasinya
#      diarsipkan pada configs/archive_100epoch_v8n_config.yaml.
#   2. Analisis kesalahan model itu menunjukkan kapasitas dan jadwal pelatihan
#      sebagai pembatas: kurva 100 epoch belum konvergen, dan pelatihan 100
#      epoch saja memakan 20,84 jam di MPS. Empat kandidat lalu dilatih di GPU
#      Kaggle dan Colab, masing-masing dari nol (docs/kaggle_training.md):
#        A. YOLOv8s 640, 300 epoch
#        B. YOLOv8s-P2 640, 250 epoch   <- terpilih
#        C. YOLOv8s 1024, 150 epoch
#        D. YOLOv8m 640, 150 epoch
#   3. Pemilihan hanya berdasarkan split valid. Split test dievaluasi sekali
#      setelah pilihan dibekukan.

seed: 42

model_arch: "yolov8s-p2.yaml"   # HANYA definisi arsitektur, tidak pernah berkas checkpoint .pt
pretrained: false

data_yaml: "data/prepared/data.yaml"

image_size: 640
batch_size: 32
epochs: 250
patience: 50
optimizer: "SGD"
learning_rate: 0.01
momentum: 0.937
weight_decay: 0.0005
scheduler: "linear"   # bawaan Ultralytics ketika cos_lr=False
cos_lr: false
close_mosaic: 15
fraction: 1.0
workers: 4
device: "auto"

flipud: 0.0   # pembalikan vertikal tidak masuk akal secara fisik untuk tanaman
