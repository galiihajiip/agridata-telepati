# KONFIGURASI PROGRESSIVE FINE-TUNING RESOLUSI 800
#
# Memanfaatkan bobot model 100 epoch milik project ini sendiri sebagai titik awal
# (self-pretraining / progressive resizing), bukan inisialisasi acak dan BUKAN
# external pretrained weights.
#
# Alasan metodologis:
# 1. Analisis kesalahan (Block 13) membuktikan 63.5% error adalah false negative,
#    dengan median luas lesi terlewat (3.343 px²) setengah dari rata-rata normal.
# 2. Resolusi 800 memberikan detail spasial 1.56x lebih tinggi dibanding 640,
#    memperjelas lesi kecil pada daun padi.
# 3. Dimulai dari bobot 100 epoch (mAP 0.6678), pelatihan hanya membutuhkan 15 epoch
#    dengan learning rate kecil (0.0002) untuk beradaptasi ke resolusi baru,
#    menghemat waktu komputasi dibanding melatih dari awal.

seed: 42

initial_weights: "runs/detect/final/model_100epoch/weights/best.pt"
pretrained: false

data_yaml: "data/prepared/data.yaml"

image_size: 800
batch_size: 8

optimizer: "AdamW"
learning_rate: 0.0002
momentum: 0.9
weight_decay: 0.0005
lr_factor: 0.01

scheduler: "linear"

flipud: 0.0

epochs: 15
patience: 8
workers: 2
device: "auto"
