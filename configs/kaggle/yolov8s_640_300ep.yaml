# KANDIDAT KAGGLE A: YOLOv8s dari nol, 640, 300 epoch.
#
# Dijalankan dengan:
#     python scripts/kaggle_train.py --config configs/kaggle/yolov8s_640_300ep.yaml
#
# Perbedaan terhadap model final 640 (yolov8n, 100 epoch, AdamW lr 0,001) dan
# alasannya:
#   - Arsitektur s, bukan n. Kapasitas n terlalu kecil untuk enam kelas lesi
#     kecil yang AP@0.5-nya masih 0,28 sampai 0,55. Tetap dibangun dari .yaml,
#     tanpa bobot pretrained.
#   - 300 epoch. Kurva 100 epoch belum konvergen (mAP, train loss, dan val loss
#     masih membaik pada epoch terakhir), dan pelatihan dari nol lazimnya
#     memakai jadwal 300 epoch.
#   - SGD lr0 0,01, yaitu resep bawaan Ultralytics untuk pelatihan dari nol
#     dengan jadwal panjang. Ablasi E05/E06 yang memenangkan AdamW hanya
#     berjalan 5 epoch pada sekitar 10 persen data, sehingga tidak berlaku
#     untuk jadwal 300 epoch.
#   - Batch 32 total (16 per GPU pada Kaggle T4 x2), dimungkinkan memori CUDA.
#
# Data uji tidak dipakai untuk memilih apa pun.

seed: 42

model_arch: "yolov8s.yaml"   # HANYA definisi arsitektur
pretrained: false

image_size: 640
batch_size: 32
epochs: 300
patience: 50
optimizer: "SGD"
learning_rate: 0.01
momentum: 0.937
weight_decay: 0.0005
cos_lr: false
close_mosaic: 15
workers: 4

flipud: 0.0
