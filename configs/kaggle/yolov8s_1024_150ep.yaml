# KANDIDAT KAGGLE C: YOLOv8s dari nol, 1024, 150 epoch.
#
# Dijalankan dengan:
#     python scripts/kaggle_train.py --config configs/kaggle/yolov8s_1024_150ep.yaml
#
# Identik dengan kandidat A kecuali resolusi dan jumlah epoch. Resolusi tinggi
# diterapkan sejak pelatihan, karena menaikkan resolusi hanya saat inferensi
# terbukti merusak (0,6277 menjadi 0,4200 pada 960). Sasarannya lesi kecil:
# median bbox Brown spot sekitar 29x29 px pada 640, menjadi sekitar 46x46 px
# pada 1024.
#
# Epoch dipangkas menjadi 150 agar muat dalam satu sesi Kaggle (sekitar 2,5x
# biaya per epoch dibanding 640) sebelum tenggat submission. Evaluasi memakai
# imgsz 1024 secara otomatis karena Ultralytics membawa imgsz dari checkpoint.
#
# Batch 24 (12 per GPU), bukan 32: pada 1024 memori per T4 diperkirakan
# sekitar 11 dari 15 GB dengan batch 32, terlalu dekat batas untuk citra
# dengan lebih dari 100 bbox. Ultralytics mengakumulasi gradien ke nominal
# batch 64, sehingga dampaknya pada optimisasi kecil.

seed: 42

model_arch: "yolov8s.yaml"   # HANYA definisi arsitektur
pretrained: false

image_size: 1024
batch_size: 24
epochs: 150
patience: 50
optimizer: "SGD"
learning_rate: 0.01
momentum: 0.937
weight_decay: 0.0005
cos_lr: false
close_mosaic: 10
workers: 4

flipud: 0.0
