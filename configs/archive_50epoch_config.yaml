# ARSIP: KONFIGURASI MODEL 50 EPOCH
#
# Berkas ini merupakan konfigurasi yang menghasilkan model 50 *epoch*, yaitu
# model yang pernah dibekukan untuk submission sebelum digantikan model 100
# *epoch*. Berkas ini disimpan sebagai catatan sejarah dan tidak dipakai lagi
# oleh pipeline mana pun.
#
# Hasil model ini: mAP@0.5 = 0,6401 dan F1 macro = 0,6383 pada split valid,
# serta 0,6246 dan 0,6272 pada split test, keduanya dengan ambang NMS 0,5.
# Artefak evaluasinya ada pada artifacts/archive/50epoch_640_run/.
#
# Konfigurasi yang berlaku sekarang, beserta seluruh alasan pemilihan setiap
# parameter dan riwayat perubahan anggaran epoch, ada pada
# configs/final_model_config.yaml. Satu-satunya perbedaan nilai terhadap
# konfigurasi final adalah epochs (50 berbanding 100) dan patience
# (8 berbanding 20).

seed: 42
model_arch: yolov8n.yaml
pretrained: false
data_yaml: data/prepared/data.yaml
image_size: 640
batch_size: 16
optimizer: AdamW
learning_rate: 0.001
momentum: 0.9
weight_decay: 0.0005
scheduler: linear
flipud: 0.0
fraction: 1.0
epochs: 50
patience: 8
workers: 2
device: auto
