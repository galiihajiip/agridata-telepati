# Matriks percobaan hyperparameter baseline yang terkontrol.
#
# Metodologi: pengujian satu faktor pada satu waktu, bukan faktorial penuh.
# Setiap varian mengubah tepat SATU faktor terhadap `baseline`, sementara
# seluruh parameter lain ditahan tetap. Dengan begitu efek masing-masing faktor
# dapat diisolasi alih-alih tercampur karena beberapa perubahan sekaligus.
#
# Catatan skala: matriks ini sengaja memakai fraksi KECIL data latih dengan
# sedikit epoch, supaya total waktu untuk satu putaran penyaringan pembanding
# tetap terkendali. Ini BUKAN rezim pelatihan final. Konfigurasi terbaik yang
# ditemukan di sini merupakan kandidat untuk ditelusuri lebih lanjut, bukan
# jawaban akhir.
#
# Seluruh varian memakai dataset canonical yang sama, split train dan valid
# resmi yang sama, metode evaluasi yang sama yaitu model.val() untuk mAP@0.5,
# seed yang sama, dan tanpa external pretrained weights.

common:
  seed: 42
  model_arch: "yolov8n.yaml"
  pretrained: false
  data_yaml: "data/prepared/data.yaml"
  device: "auto"
  workers: 2
  validate_during_training: false  # validasi penuh per epoch dilewati karena mahal; cukup satu val() setelah pelatihan

baseline:
  image_size: 320
  batch_size: 16
  epochs: 5
  fraction: 0.08
  optimizer: "AdamW"
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0005
  augmentation: {}   # Ultralytics defaults (untouched)

variants:
  - id: image_size_640
    axis: image_size
    overrides:
      image_size: 640

  - id: batch_size_32
    axis: batch_size
    overrides:
      batch_size: 32

  - id: learning_rate_low
    axis: learning_rate
    overrides:
      learning_rate: 0.0001

  - id: optimizer_sgd
    axis: optimizer
    overrides:
      optimizer: "SGD"
      momentum: 0.937   # SGD-appropriate momentum (Ultralytics default for SGD)

  - id: augmentation_strong
    axis: augmentation_strength
    overrides:
      augmentation:
        degrees: 10.0
        translate: 0.2
        scale: 0.7
        mixup: 0.1
        hsv_v: 0.6

  - id: training_duration_long
    axis: training_duration
    overrides:
      epochs: 10
