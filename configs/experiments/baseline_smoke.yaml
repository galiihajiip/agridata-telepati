# Konfigurasi UJI ASAP baseline yang patuh batasan kompetisi.
#
# Ini BUKAN model final. Satu-satunya tujuannya membuktikan pipeline berjalan
# dari ujung ke ujung, yaitu model dapat dimuat, label valid, pelatihan mulai,
# validasi jalan, bobot tersimpan, dan inferensi bekerja, tanpa sama sekali
# melibatkan external pretrained weights.
#
# Pencarian hyperparameter yang sesungguhnya dilakukan pada matriks percobaan
# dan rangkaian ablasi, sedangkan konfigurasi final dibekukan pada
# configs/final_model_config.yaml.

seed: 42

model_arch: "yolov8n.yaml"   # architecture definition ONLY, never a .pt checkpoint
pretrained: false

data_yaml: "data/prepared/data.yaml"

image_size: 320               # reduced from the dataset's native 640 for smoke-test speed
batch_size: 8
epochs: 2
fraction: 0.05                 # small subset of train data, smoke test, not full training
workers: 2
device: "auto"                 # resolved at runtime via agridata.device.detect_device()
plots: false                   # avoids any plotting-related asset fetch; not needed here

project: "runs/detect"
name: "block6_baseline_smoke"
