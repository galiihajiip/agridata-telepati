# Block 6 — compliant baseline SMOKE TEST configuration.
#
# This is NOT the final model. Its only purpose is to prove the pipeline
# works end-to-end (model loads, labels are valid, training starts,
# validation runs, weights save, inference works) with no external
# pretrained weights involved. Full hyperparameter experimentation happens
# in later blocks (9-14); the final frozen config is decided in Block 14.

seed: 42

model_arch: "yolov8n.yaml"   # architecture definition ONLY — never a .pt checkpoint
pretrained: false

data_yaml: "data/prepared/data.yaml"

image_size: 320               # reduced from the dataset's native 640 for smoke-test speed
batch_size: 8
epochs: 2
fraction: 0.05                 # small subset of train data — smoke test, not full training
workers: 2
device: "auto"                 # resolved at runtime via agridata.device.detect_device()
plots: false                   # avoids any plotting-related asset fetch; not needed here

project: "runs/detect"
name: "block6_baseline_smoke"
