# Ablasi augmentasi terkontrol.
#
# Metodologi: pengujian satu faktor pada satu waktu, bertolak dari referensi
# TANPA AUGMENTASI yang bersih, bukan dari baseline matriks percobaan yang
# sudah mengaktifkan paket augmentasi bawaan Ultralytics. Dengan cara ini
# efek individual setiap jenis augmentasi dapat diisolasi. Skalanya sama
# dengan matriks percobaan (imgsz=320, batch=16, 5 epoch, 8 persen data
# latih) agar langsung sebanding dengan E02, yaitu augmentasi gabungan
# bawaan dengan mAP@0.5=0.0018, yang dipakai ulang sebagai referensi dan
# tidak dijalankan ulang.
#
# Kelayakan semantik dinilai SEBELUM percobaan apa pun dijalankan, lihat
# artifacts/reports/block11_augmentation_ablation.md. Sebagai contoh,
# pembalikan vertikal tetap diuji secara empiris tetapi sejak awal ditandai
# tidak masuk akal secara fisik untuk tanaman yang orientasinya ditentukan
# gravitasi, terlepas dari berapa pun efek yang terukur.

common:
  seed: 42
  model_arch: "yolov8n.yaml"
  pretrained: false
  data_yaml: "data/prepared/data.yaml"
  device: "auto"
  workers: 2
  validate_during_training: false
  image_size: 320
  batch_size: 16
  epochs: 5
  fraction: 0.08
  optimizer: "AdamW"
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0005

# Seluruh augmentasi dimatikan, menjadi titik referensi ablasi ini.
no_augmentation:
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.0
  degrees: 0.0
  translate: 0.0
  scale: 0.0
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.0
  mosaic: 0.0
  mixup: 0.0
  copy_paste: 0.0
  erasing: 0.0

variants:
  - id: hflip_only
    augmentation: "horizontal_flip"
    overrides: { fliplr: 0.5 }
    plausibility: "MASUK AKAL, daun atau tanaman yang difoto dari sisi lateral yang dicerminkan tetap realistis secara fisik; identitas penyakit tidak bergantung pada orientasi kiri-kanan."

  - id: vflip_only
    augmentation: "vertical_flip"
    overrides: { flipud: 0.5 }
    plausibility: "DIRAGUKAN, tanaman dan daun padi memiliki orientasi yang ditentukan gravitasi, baik dari arah tumbuhnya maupun dari cara kamera atau drone realistis merekamnya. Tanaman terbalik bukan kondisi yang akan ditemui sistem saat dipakai. Tetap diuji secara empiris, tetapi sejak awal ditandai untuk dikeluarkan dari konfigurasi final berapa pun efek yang terukur, kecuali ada bukti yang sangat kuat membantah penalaran ini."

  - id: rotation_only
    augmentation: "rotation"
    overrides: { degrees: 15.0 }
    plausibility: "MASUK AKAL bila dibatasi, karena mensimulasikan kemiringan kamera yang realistis ketika perangkat genggam atau drone tidak benar-benar datar. Sudutnya dijaga jauh di bawah rotasi bersudut besar, yang akan memunculkan kembali masalah orientasi gravitasi seperti pada pembalikan vertikal."

  - id: scale_only
    augmentation: "scaling"
    overrides: { scale: 0.5 }
    plausibility: "MASUK AKAL, jarak kamera terhadap objek memang bervariasi secara alami, baik karena ketinggian drone maupun jarak pengambilan dengan tangan."

  - id: translate_only
    augmentation: "translation"
    overrides: { translate: 0.1 }
    plausibility: "MASUK AKAL, pembingkaian dan posisi objek di dalam bidang gambar bervariasi secara alami."

  - id: brightness_only
    augmentation: "brightness_contrast"
    overrides: { hsv_v: 0.4 }
    plausibility: "MASUK AKAL, pencahayaan di lahan terbuka sangat bervariasi mengikuti matahari, awan, naungan, dan waktu pengambilan."

  - id: color_only
    augmentation: "color_transform"
    overrides: { hsv_h: 0.015, hsv_s: 0.7 }
    plausibility: "MASUK AKAL tetapi sengaja dibatasi. Pergeseran hue dijaga kecil (1,5 persen) karena warna lesi merupakan ciri diagnostik yang nyata bagi beberapa kelas canonical, misalnya Brown spot terhadap Blast. Pergeseran hue yang agresif berisiko menghasilkan citra yang label sebenarnya tidak lagi cocok secara visual, dan itu menyesatkan model, bukan sekadar menambah derau."

  - id: mosaic_only
    augmentation: "mosaic (tidak termasuk daftar kandidat awal, tetapi aktif secara bawaan pada Ultralytics; disertakan demi kelengkapan karena diam-diam memengaruhi seluruh percobaan matriks)"
    overrides: { mosaic: 1.0 }
    plausibility: "DIRAGUKAN untuk domain ini, karena mosaic menggabungkan empat citra latih yang tidak berkaitan menjadi satu ubin. Penggabungan itu dapat merusak sinyal skala objek yang pada profiling dataset sudah terbukti bermakna diagnostik per kelas, yaitu kelas lesi penyakit yang khas berkotak kecil dan kelas Healthy yang khas berkotak besar. Tetap diuji secara empiris alih-alih diasumsikan ke salah satu arah."
