# KONFIGURASI PERCOBAAN RESOLUSI TINGGI (960)
#
# Satu variabel utama diubah terhadap konfigurasi final 640: ukuran citra
# 640 -> 960. Batch diturunkan 16 -> 8 karena keterbatasan memori, bukan
# karena alasan metodologis: pada 960 dengan batch 16 estimasi pemakaian
# memori sekitar 11,9 GB dari 16 GB RAM terpadu, terlalu mepet dan berisiko
# gagal di tengah pelatihan.
#
# Alasan menguji resolusi lebih tinggi: seluruh analisis kesalahan pada
# model 640 menunjuk ke arah yang sama, yaitu objek kecil dan adegan padat.
# 63,5 persen kesalahan berupa false negative, median luas objek yang
# terlewat sekitar setengah median keseluruhan, dan 38 sampai 47 persen
# bounding box menutupi kurang dari satu persen luas citra.
#
# Catatan penting: menaikkan resolusi hanya pada tahap inferensi sudah diuji
# dan hasilnya jauh lebih buruk (mAP@0.5 turun dari 0,6277 menjadi 0,4200
# pada 960 dan 0,1164 pada 1280). Kegagalan itu disebabkan ketidakcocokan
# antara resolusi latih dan resolusi inferensi, sehingga resolusi tinggi
# harus diterapkan sejak pelatihan, bukan ditambahkan belakangan.
#
# FINAL MODEL CONFIGURATION (Block 14), frozen for Block 15's full-scale training run.
#
#
# Status: eksperimen ini DIHENTIKAN pada epoch 7 dan tidak pernah diselesaikan.
# Alasannya, model pada resolusi 640 saja terbukti belum konvergen dalam 50
# epoch, sehingga model resolusi 960 yang konvergensinya teramati sekitar dua
# kali lebih lambat akan jauh lebih belum konvergen pada anggaran yang sama.
# Anggaran komputasi kami alihkan ke perpanjangan 100 epoch pada resolusi 640,
# dan pilihan itu terbukti menaikkan mAP@0.5 dari 0,6401 menjadi 0,6678.
#
# Checkpoint yang dijeda beserta skrip pelanjutnya tetap disimpan; lihat
# artifacts/reports/experiment_960_status.md dan
# scripts/resume_training_960.py.
#
# Alasan pemilihan setiap parameter yang diwarisi dari konfigurasi final ada
# pada configs/final_model_config.yaml. Dua perbedaan yang disengaja terhadap
# konfigurasi itu adalah ukuran citra (960 berbanding 640) dan batch (8
# berbanding 16), dan keduanya sudah dijelaskan di atas.

seed: 42
model_arch: yolov8n.yaml
pretrained: false
data_yaml: data/prepared/data.yaml
image_size: 960
batch_size: 8
optimizer: AdamW
learning_rate: 0.001
momentum: 0.9
weight_decay: 0.0005
scheduler: linear
flipud: 0.0
fraction: 1.0
epochs: 50
patience: 8
workers: 2
device: auto
